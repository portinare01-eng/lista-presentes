<div class="login">

    <h1>🎁 Área administrativa</h1>

    <div class="subtitulo">
        Entre para administrar sua lista
    </div>

    <div
        id="mensagem"
        class="mensagem"
    ></div>

    <form id="formLogin">

        <label for="email">
            E-mail
        </label>

        <input
            id="email"
            type="email"
            placeholder="Seu e-mail"
            autocomplete="email"
            required
        >

        <label for="senha">
            Senha
        </label>

        <input
            id="senha"
            type="password"
            placeholder="Sua senha"
            autocomplete="current-password"
            required
        >

        <button
            id="botaoLogin"
            type="submit"
        >
            Entrar
        </button>

    </form>

    <button
        class="voltar"
        onclick="voltarParaLista()"
        type="button"
    >
        Voltar para a lista
    </button>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    // =====================================================
    // CONFIGURAÇÃO
    // =====================================================

    const SUPABASE_URL =
        "https://hoeefymvmncbgzrxdcwj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_Fdv87uRPzxCOBmv-MFHt0w_dBdgMMrq";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const formLogin =
        document.getElementById("formLogin");

    const botaoLogin =
        document.getElementById("botaoLogin");

    const mensagem =
        document.getElementById("mensagem");


    // =====================================================
    // MENSAGEM
    // =====================================================

    function mostrarMensagem(texto, tipo) {

        mensagem.innerText = texto;

        mensagem.className =
            "mensagem " + tipo;

    }


    // =====================================================
    // LOGIN
    // =====================================================

    formLogin.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const senha =
                document.getElementById("senha")
                    .value;


            if (!email || !senha) {

                mostrarMensagem(
                    "Preencha o e-mail e a senha.",
                    "erro"
                );

                return;
            }


            botaoLogin.disabled = true;

            botaoLogin.innerText =
                "Entrando...";


            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({
                        email: email,
                        password: senha
                    });


            if (error) {

                console.error(error);

                mostrarMensagem(
                    "E-mail ou senha incorretos.",
                    "erro"
                );

                botaoLogin.disabled = false;

                botaoLogin.innerText =
                    "Entrar";

                return;
            }


            if (!data || !data.user) {

                mostrarMensagem(
                    "Não foi possível fazer o login.",
                    "erro"
                );

                botaoLogin.disabled = false;

                botaoLogin.innerText =
                    "Entrar";

                return;
            }


            mostrarMensagem(
                "Login realizado! Entrando...",
                "sucesso"
            );


            // Só redireciona depois de um login confirmado.
            setTimeout(function() {

                window.location.href =
                    "painel.html";

            }, 500);

        }
    );


    // =====================================================
    // VOLTAR PARA A LISTA
    // =====================================================

    function voltarParaLista() {

        window.location.href =
            "index.html";

    }

</script>
