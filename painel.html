<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Lista de Presentes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f4f0;
            color: #333;
        }

        header {
            background: white;
            padding: 25px 20px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
        }

        .header-interno {
            max-width: 1100px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .sair {
            width: auto;
            background: #eee;
            color: #333;
            padding: 10px 18px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px 15px 50px;
        }

        .topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .topo h2 {
            margin: 0;
        }

        .novo {
            width: auto;
            padding: 12px 18px;
        }

        .lista {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .presente {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .08);
        }

        .presente-conteudo {
            padding: 20px;
        }

        .presente h3 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .descricao {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .quantidade {
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 12px;
            background: #333;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: .85;
        }

        .botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .editar {
            background: #555;
        }

        .excluir {
            background: #b71c1c;
        }

        .reservas {
            background: #eee;
            color: #333;
            margin-top: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);

            justify-content: center;
            align-items: center;

            padding: 20px;
            z-index: 1000;
        }

        .modal-conteudo {
            background: white;
            width: 100%;
            max-width: 450px;

            border-radius: 16px;
            padding: 25px;

            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-conteudo h2 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #333;
        }

        .salvar {
            margin-top: 20px;
        }

        .cancelar {
            background: #ddd;
            color: #333;
            margin-top: 8px;
        }

        .mensagem {
            display: none;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .sucesso {
            background: #e8f5e9;
            color: #256029;
        }

        .erro {
            background: #ffebee;
            color: #b71c1c;
        }

        .sem-presentes {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            color: #777;
        }

        .lista-reservas {
            margin-top: 15px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .reserva {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .reserva:last-child {
            border-bottom: none;
        }

        .reserva strong {
            display: block;
        }

        .nenhuma-reserva {
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .header-interno {
                flex-direction: column;
                align-items: stretch;
            }

            .header-interno h1 {
                text-align: center;
            }

            .topo {
                flex-direction: column;
                align-items: stretch;
            }

            .topo h2 {
                text-align: center;
            }

            .novo {
                width: 100%;
            }

            .lista {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <header>

        <div class="header-interno">

            <h1>🎁 Administração</h1>

            <button
                class="sair"
                onclick="sair()"
            >
                Sair
            </button>

        </div>

    </header>


    <main class="container">

        <div
            id="mensagem"
            class="mensagem"
        ></div>


        <div class="topo">

            <h2>
                Meus presentes
            </h2>

            <button
                class="novo"
                onclick="abrirNovo()"
            >
                ➕ Novo presente
            </button>

        </div>


        <div
            id="lista"
            class="lista"
        >
        </div>

    </main>


    <!-- =====================================================
         MODAL PRESENTE
         ===================================================== -->

    <div
        id="modalPresente"
        class="modal"
    >

        <div class="modal-conteudo">

            <h2 id="tituloModal">
                Novo presente
            </h2>


            <label for="nomePresente">
                Nome do presente
            </label>

            <input
                id="nomePresente"
                type="text"
                placeholder="Ex.: Jogo de panelas"
            >


            <label for="descricaoPresente">
                Descrição
            </label>

            <textarea
                id="descricaoPresente"
                placeholder="Descrição do presente..."
            ></textarea>


            <label for="quantidadePresente">
                Quantidade
            </label>

            <input
                id="quantidadePresente"
                type="number"
                min="0"
                value="1"
            >


            <label for="imagemPresente">
                Foto do presente
            </label>
            
            <input
                id="imagemPresente"
                type="file"
                accept="image/*"
            >


            <button
                class="salvar"
                onclick="salvarPresente()"
            >
                Salvar presente
            </button>


            <button
                class="cancelar"
                onclick="fecharModal()"
            >
                Cancelar
            </button>

        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // =====================================================
        // CONFIGURAÇÃO
        // =====================================================

        const SUPABASE_URL =
            "https://hoeefymvmncbgzrxdcwj.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_Fdv87uRPzxCOBmv-MFHt0w_dBdgMMrq";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // =====================================================
        // VARIÁVEIS
        // =====================================================

        let presenteEditando = null;


        // =====================================================
        // VERIFICAR LOGIN
        // =====================================================

        async function verificarLogin() {

            const {
                data,
                error
            } = await supabaseClient.auth.getUser();


            if (error || !data.user) {

                window.location.href =
                    "admin.html";

                return false;
            }


            return true;
        }


        // =====================================================
        // CARREGAR PRESENTES
        // =====================================================

        async function carregarPresentes() {

            const lista =
                document.getElementById("lista");


            const logado =
                await verificarLogin();


            if (!logado) {
                return;
            }


            const {
                data,
                error
            } = await supabaseClient
                .from("presentes")
                .select("*")
                .order("id", {
                    ascending: true
                });


            if (error) {

                console.error(error);

                lista.innerHTML = `
                    <div class="erro" style="display:block;">
                        Não foi possível carregar os presentes.
                    </div>
                `;

                return;
            }


            if (!data || data.length === 0) {

                lista.innerHTML = `
                    <div class="sem-presentes">
                        Nenhum presente cadastrado.
                    </div>
                `;

                return;
            }


            lista.innerHTML = "";


            data.forEach(presente => {

                const card =
                    document.createElement("div");


                card.className =
                    "presente";


                card.innerHTML = `

                    <div class="presente-conteudo">

                        <h3>
                            ${escaparHTML(presente.nome)}
                        </h3>

                        <div class="descricao">
                            ${escaparHTML(
                                presente.descricao || ""
                            )}
                        </div>

                        <div class="quantidade">
                            Disponíveis:
                            ${presente.quantidade}
                        </div>

                        <div class="botoes">

                            <button
                                class="editar"
                                onclick="abrirEditar(${presente.id})"
                            >
                                ✏️ Editar
                            </button>

                            <button
                                class="excluir"
                                onclick="excluirPresente(${presente.id})"
                            >
                                🗑️ Excluir
                            </button>

                        </div>

                        <button
                            class="reservas"
                            onclick="verReservas(${presente.id})"
                        >
                            👥 Ver reservas
                        </button>

                        <div
                            id="reservas-${presente.id}"
                            class="lista-reservas"
                        ></div>

                    </div>
                `;


                lista.appendChild(card);

            });

        }


        // =====================================================
        // NOVO PRESENTE
        // =====================================================

        function abrirNovo() {

            presenteEditando = null;


            document.getElementById(
                "tituloModal"
            ).innerText =
                "Novo presente";


            document.getElementById(
                "nomePresente"
            ).value = "";


            document.getElementById(
                "descricaoPresente"
            ).value = "";


            document.getElementById(
                "quantidadePresente"
            ).value = 1;


            document.getElementById(
                "imagemPresente"
            ).value = "";


            document.getElementById(
                "modalPresente"
            ).style.display = "flex";

        }


        // =====================================================
        // EDITAR
        // =====================================================

        async function abrirEditar(id) {

            const {
                data,
                error
            } = await supabaseClient
                .from("presentes")
                .select("*")
                .eq("id", id)
                .single();


            if (error) {

                alert(
                    "Não foi possível carregar o presente."
                );

                return;
            }


            presenteEditando = id;


            document.getElementById(
                "tituloModal"
            ).innerText =
                "Editar presente";


            document.getElementById(
                "nomePresente"
            ).value =
                data.nome;


            document.getElementById(
                "descricaoPresente"
            ).value =
                data.descricao || "";


            document.getElementById(
                "quantidadePresente"
            ).value =
                data.quantidade;


            document.getElementById(
                "imagemPresente"
            ).value =
                data.imagem_url || "";


            document.getElementById(
                "modalPresente"
            ).style.display =
                "flex";

        }


        // =====================================================
        // SALVAR
        // =====================================================

        async function salvarPresente() {

            const nome =
                document.getElementById(
                    "nomePresente"
                ).value.trim();


            const descricao =
                document.getElementById(
                    "descricaoPresente"
                ).value.trim();


            const quantidade =
                parseInt(
                    document.getElementById(
                        "quantidadePresente"
                    ).value
                );


            const arquivoImagem =
                document.getElementById("imagemPresente").files[0];


            if (!nome) {

                alert(
                    "Digite o nome do presente."
                );

                return;
            }


            if (
                isNaN(quantidade) ||
                quantidade < 0
            ) {

                alert(
                    "Digite uma quantidade válida."
                );

                return;
            }

            let imagemUrl = null;
            
            if (arquivoImagem) {
            
                const extensao =
                    arquivoImagem.name.split(".").pop();
            
                const nomeArquivo =
                    `${Date.now()}-${Math.random()
                        .toString(36)
                        .substring(2)}.${extensao}`;
            
                const caminho =
                    `presentes/${nomeArquivo}`;
            
                const { error: uploadError } =
                    await supabaseClient
                        .storage
                        .from("presentes")
                        .upload(caminho, arquivoImagem);
            
                if (uploadError) {
            
                    console.error(uploadError);
            
                    alert(
                        "Não foi possível enviar a imagem."
                    );
            
                    return;
                }
            
                const { data: urlData } =
                    supabaseClient
                        .storage
                        .from("presentes")
                        .getPublicUrl(caminho);
            
                imagemUrl =
                    urlData.publicUrl;
                }

            let resultado;


            if (presenteEditando === null) {

                resultado =
                    await supabaseClient
                        .from("presentes")
                        .insert({
                            nome: nome,
                            descricao: descricao,
                            quantidade: quantidade,
                             imagem_url:
                                imagemUrl
                        });

            } else {

                resultado =
                    await supabaseClient
                        .from("presentes")
                        .update({
                            nome: nome,
                            descricao: descricao,
                            quantidade: quantidade,
                            imagem_url:
                                imagemUrl
                        })
                        .eq(
                            "id",
                            presenteEditando
                        );

            }


            if (resultado.error) {

                console.error(
                    resultado.error
                );

                alert(
                    "Não foi possível salvar o presente."
                );

                return;
            }


            fecharModal();

            mostrarMensagem(
                "Presente salvo com sucesso!"
            );


            carregarPresentes();

        }


        // =====================================================
        // EXCLUIR
        // =====================================================

        async function excluirPresente(id) {

            const confirmar =
                confirm(
                    "Tem certeza que deseja excluir este presente?"
                );


            if (!confirmar) {
                return;
            }


            const {
                error
            } = await supabaseClient
                .from("presentes")
                .delete()
                .eq("id", id);


            if (error) {

                console.error(error);

                alert(
                    "Não foi possível excluir o presente."
                );

                return;
            }


            mostrarMensagem(
                "Presente excluído."
            );


            carregarPresentes();

        }


        // =====================================================
        // VER RESERVAS
        // =====================================================

        async function verReservas(id) {

            const area =
                document.getElementById(
                    "reservas-" + id
                );


            area.innerHTML =
                "Carregando reservas...";


            const {
                data,
                error
            } = await supabaseClient
                .from("reservas")
                .select("*")
                .eq("presente_id", id)
                .order("criado_em", {
                    ascending: false
                });


            if (error) {

                console.error(error);

                area.innerHTML =
                    "Não foi possível carregar as reservas.";

                return;
            }


            if (!data || data.length === 0) {

                area.innerHTML = `
                    <div class="nenhuma-reserva">
                        Nenhuma reserva ainda.
                    </div>
                `;

                return;
            }


            area.innerHTML = "";


            data.forEach(reserva => {

                const div =
                    document.createElement("div");


                div.className =
                    "reserva";


                const dataReserva =
                    new Date(
                        reserva.criado_em
                    ).toLocaleString(
                        "pt-BR"
                    );


                div.innerHTML = `

                    <strong>
                        ${escaparHTML(reserva.nome)}
                    </strong>

                    Quantidade:
                    ${reserva.quantidade}

                    <br>

                    <small>
                        ${dataReserva}
                    </small>

                `;


                area.appendChild(div);

            });

        }


        // =====================================================
        // FECHAR MODAL
        // =====================================================

        function fecharModal() {

            document.getElementById(
                "modalPresente"
            ).style.display =
                "none";

        }


        // =====================================================
        // MENSAGEM
        // =====================================================

        function mostrarMensagem(texto) {

            const mensagem =
                document.getElementById(
                    "mensagem"
                );


            mensagem.innerText =
                texto;


            mensagem.className =
                "mensagem sucesso";


            mensagem.style.display =
                "block";


            setTimeout(() => {

                mensagem.style.display =
                    "none";

            }, 4000);

        }


        // =====================================================
        // SAIR
        // =====================================================

        async function sair() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "admin.html";

        }


        // =====================================================
        // SEGURANÇA HTML
        // =====================================================

        function escaparHTML(texto) {

            return String(texto)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // =====================================================
        // INICIAR
        // =====================================================

        carregarPresentes();

    </script>

</body>

</html>
