```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Presentes</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f4f0;
            color: #333;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        header {
            background: #ffffff;
            padding: 40px 20px 30px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        header p {
            margin: 0;
            color: #777;
            line-height: 1.5;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 25px 15px 50px;
        }

        /* =========================
           LISTA
        ========================= */

        .lista {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );
            gap: 20px;
        }

        /* =========================
           CARD
        ========================= */

        .presente {
            background: #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .presente img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .conteudo {
            padding: 18px;
        }

        .conteudo h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .descricao {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .quantidade {
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* =========================
           BOTÕES
        ========================= */

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 13px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .esgotado {
            background: #aaa;
            cursor: not-allowed;
        }

        /* =========================
           MENSAGEM
        ========================= */

        .mensagem {
            display: none;
            background: #e8f5e9;
            color: #256029;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);

            justify-content: center;
            align-items: center;

            padding: 20px;
            z-index: 1000;
        }

        .modal-conteudo {
            background: white;
            width: 100%;
            max-width: 420px;

            border-radius: 16px;
            padding: 25px;
        }

        .modal-conteudo h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* =========================
           INPUT
        ========================= */

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #333;
        }

        /* =========================
           CONTROLE QUANTIDADE
        ========================= */

        .controle {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 20px;

            margin: 15px 0 20px;
        }

        .controle button {
            width: 50px;
            height: 45px;

            padding: 0;

            font-size: 24px;
        }

        #quantidadeEscolhida {
            min-width: 30px;

            text-align: center;

            font-size: 20px;
            font-weight: bold;
        }

        /* =========================
           BOTÕES MODAL
        ========================= */

        .confirmar {
            background: #333;
            margin-top: 10px;
        }

        .cancelar {
            background: #ddd;
            color: #333;
            margin-top: 8px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 30px 20px 25px;
            }

            header h1 {
                font-size: 26px;
            }

            .container {
                padding: 20px 12px 40px;
            }

            .lista {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .presente img {
                height: 220px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         CABEÇALHO
    ========================= -->

    <header>

        <h1>🎁 Lista de Presentes</h1>

        <p>
            Escolha um presente e deixe seu nome
            para sabermos quem nos presenteou.
        </p>

    </header>


    <!-- =========================
         CONTEÚDO
    ========================= -->

    <main class="container">

        <div
            id="mensagem"
            class="mensagem">
        </div>


        <!--
            A lista começa vazia.

            Na próxima etapa,
            os presentes virão do Supabase.
        -->

        <div
            id="lista"
            class="lista">
        </div>

    </main>


    <!-- =========================
         MODAL
    ========================= -->

    <div
        id="modal"
        class="modal">


        <div class="modal-conteudo">


            <h2 id="nomePresente">
                Presente
            </h2>


            <label for="nome">
                Seu nome
            </label>


            <input
                id="nome"
                type="text"
                placeholder="Digite seu nome"
                autocomplete="name"
            >


            <label style="margin-top: 18px;">
                Quantidade
            </label>


            <div class="controle">

                <button
                    type="button"
                    onclick="diminuirQuantidade()">
                    −
                </button>


                <span id="quantidadeEscolhida">
                    1
                </span>


                <button
                    type="button"
                    onclick="aumentarQuantidade()">
                    +
                </button>

            </div>


            <button
                type="button"
                class="confirmar"
                onclick="confirmarPresente()">

                Confirmar presente

            </button>


            <button
                type="button"
                class="cancelar"
                onclick="fecharModal()">

                Cancelar

            </button>


        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /*
         * Nesta primeira etapa não existe banco de dados.
         *
         * Vamos apenas deixar a estrutura
         * preparada para receber os presentes.
         */


        let presenteSelecionado = null;

        let quantidadeEscolhida = 1;


        // =================================
        // ABRIR MODAL
        // =================================

        function abrirModal(presente) {

            presenteSelecionado = presente;

            quantidadeEscolhida = 1;


            document.getElementById(
                "nomePresente"
            ).innerText = presente.nome;


            document.getElementById(
                "quantidadeEscolhida"
            ).innerText = quantidadeEscolhida;


            document.getElementById(
                "nome"
            ).value = "";


            document.getElementById(
                "modal"
            ).style.display = "flex";

        }


        // =================================
        // FECHAR MODAL
        // =================================

        function fecharModal() {

            document.getElementById(
                "modal"
            ).style.display = "none";

        }


        // =================================
        // AUMENTAR
        // =================================

        function aumentarQuantidade() {

            if (!presenteSelecionado) {
                return;
            }


            if (
                quantidadeEscolhida <
                presenteSelecionado.quantidade
            ) {

                quantidadeEscolhida++;

                document.getElementById(
                    "quantidadeEscolhida"
                ).innerText =
                    quantidadeEscolhida;

            }

        }


        // =================================
        // DIMINUIR
        // =================================

        function diminuirQuantidade() {

            if (
                quantidadeEscolhida > 1
            ) {

                quantidadeEscolhida--;

                document.getElementById(
                    "quantidadeEscolhida"
                ).innerText =
                    quantidadeEscolhida;

            }

        }


        // =================================
        // CONFIRMAR
        // =================================

        function confirmarPresente() {

            const nome =
                document
                    .getElementById("nome")
                    .value
                    .trim();


            if (nome === "") {

                alert(
                    "Digite seu nome."
                );

                return;
            }


            /*
             * Nesta etapa ainda não salvamos
             * no banco.
             *
             * Isso será feito na próxima etapa.
             */

            alert(
                "A estrutura está funcionando!\n\n" +
                "Na próxima etapa vamos conectar " +
                "essa lista ao banco de dados."
            );

        }


        // =================================
        // TESTE INICIAL
        // =================================

        console.log(
            "Lista de presentes carregada."
        );

    </script>


</body>

</html>
```
