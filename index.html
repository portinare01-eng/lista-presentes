<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Presentes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f4f0;
            color: #333;
        }

        header {
            background: white;
            padding: 40px 20px 30px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        header p {
            margin: 0;
            color: #777;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 25px 15px 50px;
        }

        .lista {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .presente {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .presente img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .conteudo {
            padding: 18px;
        }

        .conteudo h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .descricao {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .quantidade {
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 13px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .carregando {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        .erro {
            background: #ffebee;
            color: #b71c1c;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        @media (max-width: 600px) {

            header {
                padding: 30px 20px 25px;
            }

            header h1 {
                font-size: 26px;
            }

            .container {
                padding: 20px 12px 40px;
            }

            .lista {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .presente img {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🎁 Lista de Presentes</h1>

        <p>
            Escolha um presente e deixe seu nome
            para sabermos quem nos presenteou.
        </p>
    </header>

    <main class="container">

        <div id="lista" class="lista">
            <div class="carregando">
                Carregando presentes...
            </div>
        </div>

    </main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // ==========================================
        // CONFIGURAÇÃO DO SUPABASE
        // ==========================================

        const SUPABASE_URL = "COLE_SUA_URL_AQUI";

        const SUPABASE_PUBLISHABLE_KEY = "COLE_SUA_PUBLISHABLE_KEY_AQUI";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        // ==========================================
        // BUSCAR PRESENTES
        // ==========================================

        async function carregarPresentes() {

            const lista = document.getElementById("lista");

            const { data, error } = await supabaseClient
                .from("presentes")
                .select("*")
                .order("id", { ascending: true });


            // Se aconteceu algum erro
            if (error) {

                console.error("Erro ao buscar presentes:", error);

                lista.innerHTML = `
                    <div class="erro">
                        Não foi possível carregar os presentes.
                    </div>
                `;

                return;
            }


            // Se não existe nenhum presente
            if (!data || data.length === 0) {

                lista.innerHTML = `
                    <div class="carregando">
                        Nenhum presente cadastrado.
                    </div>
                `;

                return;
            }


            // Limpa a mensagem "Carregando..."
            lista.innerHTML = "";


            // Cria os cards
            data.forEach(presente => {

                const card = document.createElement("div");

                card.className = "presente";


                // Imagem provisória caso ainda não exista foto
                const imagem = presente.imagem_url
                    ? presente.imagem_url
                    : "https://via.placeholder.com/600x400?text=Presente";


                card.innerHTML = `

                    <img
                        src="${imagem}"
                        alt="${presente.nome}"
                    >

                    <div class="conteudo">

                        <h2>
                            ${presente.nome}
                        </h2>

                        <div class="descricao">
                            ${presente.descricao || ""}
                        </div>

                        <div class="quantidade">
                            Disponíveis: ${presente.quantidade}
                        </div>

                        <button onclick="selecionarPresente(${presente.id})">
                            Escolher este presente
                        </button>

                    </div>

                `;


                lista.appendChild(card);

            });

        }


        // ==========================================
        // BOTÃO
        // ==========================================

        function selecionarPresente(id) {

            alert(
                "Presente selecionado: " + id +
                "\n\nA reserva será feita na próxima etapa."
            );

        }


        // ==========================================
        // INICIAR
        // ==========================================

        carregarPresentes();

    </script>

</body>

</html>
