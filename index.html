<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Presentes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f4f0;
            color: #333;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: white;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            color: #777;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 25px 15px;
        }

        .lista {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .presente {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .presente img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .conteudo {
            padding: 18px;
        }

        .conteudo h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .quantidade {
            color: #777;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<header>
    <h1>🎁 Lista de Presentes</h1>
    <p>Escolha um presente para nos ajudar a realizar esse momento especial.</p>
</header>

<div class="container">

    <div class="lista">

        <div class="presente">

            <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=800&q=80">

            <div class="conteudo">

                <h2>Jogo de Panelas</h2>

                <div class="quantidade">
                    Disponível: 1
                </div>

                <button>
                    Escolher presente
                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
