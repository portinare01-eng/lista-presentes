// IMPORTANTE:

const supabaseClient =

        SUPABASE_URL,

    );


// ========================================

let presentes = [];

// ========================================
// CARREGAR PRESENTES DO SUPABASE
// ========================================

async function carregarPresentes() {

    const lista =
        document.querySelector(".lista");


    lista.innerHTML =
        "<p>Consultando Supabase...</p>";


    console.log(
        "Iniciando consulta ao Supabase..."
    );


    const { data, error } =
        await supabaseClient
            .from("presentes")
            .select("*")
            .order("id", {
                ascending: true
            });


    console.log(
        "DATA RECEBIDA:",
        data
    );


    console.log(
        "ERRO:",
        error
    );


    // ====================================
    // ERRO
    // ====================================

    if (error) {

        console.error(
            "ERRO SUPABASE:",
            error
        );


        lista.innerHTML = `
            <div class="erro">
                Erro ao carregar os presentes.<br><br>
                ${error.message}
            </div>
        `;


        return;
    }


    // ====================================
    // GUARDA OS PRESENTES
    // ====================================

    presentes = data || [];


    console.log(
        "Presentes carregados:",
        presentes
    );


    // ====================================
    // MOSTRA NA TELA
    // ====================================

    mostrarPresentes();

}



// ========================================
// MOSTRAR PRESENTES
// ========================================

function mostrarPresentes() {

    const lista =
        document.querySelector(".lista");


    lista.innerHTML = "";


    // Nenhum presente

    if (presentes.length === 0) {

        lista.innerHTML = `
            <p>
                Nenhum presente cadastrado.
            </p>
        `;


        return;
    }



    // ====================================
    // CRIA OS CARDS
    // ====================================

    presentes.forEach(
        (presente, indice) => {


        const card =
            document.createElement("div");


        card.className =
            "presente";


        // Imagem

        const imagem =
            presente.foto_url
                ? presente.foto_url
                : "https://via.placeholder.com/800x500?text=Presente";



        // =================================
        // BOTÃO
        // =================================

        let botao;


        if (
            Number(presente.quantidade) <= 0
        ) {

            botao = `
                <button
                    class="esgotado"
                    disabled
                >
                    Esgotado
                </button>
            `;

        } else {

            botao = `
                <button
                    type="button"
                    onclick="abrirModal(${indice})"
                >
                    Escolher presente
                </button>
            `;

        }



        // =================================
        // CARD
        // =================================

        card.innerHTML = `

            <img
                src="${imagem}"
                alt="${presente.nome || "Presente"}"
            >


            <div class="conteudo">

                <h2>
                    ${presente.nome || ""}
                </h2>


                <div class="descricao">

                    ${presente.descricao || ""}

                </div>


                <div class="quantidade">

                    Disponível:

                    <span id="qtd-${indice}">

                        ${presente.quantidade}

                    </span>

                </div>


                ${botao}

            </div>

        `;


        lista.appendChild(card);

    });

}



// ========================================
// ABRIR MODAL
// ========================================

function abrirModal(indice) {

    if (
        !presentes[indice] ||
        Number(presentes[indice].quantidade) <= 0
    ) {

        return;
    }


    presenteSelecionado =
        indice;


    quantidadeEscolhida =
        1;


    document.getElementById(
        "nomePresente"
    ).innerText =
        presentes[indice].nome;


    document.getElementById(
        "quantidadeEscolhida"
    ).innerText =
        quantidadeEscolhida;


    document.getElementById(
        "nome"
    ).value = "";


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}



// ========================================
// FECHAR MODAL
// ========================================

function fecharModal() {

    document.getElementById(
        "modal"
    ).style.display =
        "none";



    presenteSelecionado =
        null;

}



// ========================================
// AUMENTAR QUANTIDADE
// ========================================

function aumentar() {

    if (
        presenteSelecionado === null
    ) {

        return;
    }


    const disponivel =
        Number(
            presentes[
                presenteSelecionado
            ].quantidade
        );


    if (
        quantidadeEscolhida <
        disponivel
    ) {

        quantidadeEscolhida++;


        document.getElementById(
            "quantidadeEscolhida"
        ).innerText =
            quantidadeEscolhida;

    }

}



// ========================================
// DIMINUIR QUANTIDADE
// ========================================

function diminuir() {

    if (
        quantidadeEscolhida > 1
    ) {

        quantidadeEscolhida--;


        document.getElementById(
            "quantidadeEscolhida"
        ).innerText =
            quantidadeEscolhida;

    }

}
