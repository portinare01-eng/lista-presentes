<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Presentes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f4f0;
            color: #333;
        }

        header {
            background: white;
            padding: 40px 20px 30px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        header p {
            margin: 0;
            color: #777;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 25px 15px 50px;
        }

        .lista {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .presente {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .presente img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .conteudo {
            padding: 18px;
        }

        .conteudo h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .descricao {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .quantidade {
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 13px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .esgotado {
            background: #aaa;
            cursor: not-allowed;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-conteudo {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 25px;
        }

        .modal-conteudo h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #333;
        }

        .controle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 20px;
        }

        .controle button {
            width: 50px;
            height: 45px;
            padding: 0;
            font-size: 24px;
        }

        #quantidadeEscolhida {
            min-width: 30px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .confirmar {
            background: #333;
            margin-top: 10px;
        }

        .cancelar {
            background: #ddd;
            color: #333;
            margin-top: 8px;
        }

        .mensagem {
            display: none;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .sucesso {
            background: #e8f5e9;
            color: #256029;
        }

        .erro {
            background: #ffebee;
            color: #b71c1c;
        }

        .carregando {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        @media (max-width: 600px) {

            header {
                padding: 30px 20px 25px;
            }

            header h1 {
                font-size: 26px;
            }

            .container {
                padding: 20px 12px 40px;
            }

            .lista {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .presente img {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>🎁 Lista de Presentes</h1>

        <p>
            Escolha um presente e deixe seu nome
            para sabermos quem nos presenteou.
        </p>

    </header>


    <main class="container">

        <div id="mensagem" class="mensagem"></div>

        <div id="lista" class="lista">

            <div class="carregando">
                Carregando presentes...
            </div>

        </div>

    </main>


    <!-- MODAL -->

    <div id="modal" class="modal">

        <div class="modal-conteudo">

            <h2 id="nomePresente">
                Presente
            </h2>


            <label for="nome">
                Seu nome
            </label>

            <input
                id="nome"
                type="text"
                placeholder="Digite seu nome"
                autocomplete="name"
            >


            <label style="margin-top:18px;">
                Quantidade
            </label>


            <div class="controle">

                <button
                    type="button"
                    onclick="diminuirQuantidade()"
                >
                    −
                </button>


                <span id="quantidadeEscolhida">
                    1
                </span>


                <button
                    type="button"
                    onclick="aumentarQuantidade()"
                >
                    +
                </button>

            </div>


            <button
                type="button"
                class="confirmar"
                onclick="confirmarPresente()"
            >
                Confirmar presente
            </button>


            <button
                type="button"
                class="cancelar"
                onclick="fecharModal()"
            >
                Cancelar
            </button>

        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // =====================================================
        // CONFIGURAÇÃO
        // =====================================================

        const SUPABASE_URL = "https://hoeefymvmncbgzrxdcwj.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Fdv87uRPzxCOBmv-MFHt0w_dBdgMMrq";


        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        // =====================================================
        // VARIÁVEIS
        // =====================================================

        let presenteSelecionado = null;

        let quantidadeEscolhida = 1;


        // =====================================================
        // CARREGAR PRESENTES
        // =====================================================

        async function carregarPresentes() {

            const lista = document.getElementById("lista");

            const { data, error } = await supabaseClient
                .from("presentes")
                .select("*")
                .order("id", {
                    ascending: true
                });


            if (error) {

                console.error(error);

                lista.innerHTML = `
                    <div class="erro" style="display:block;">
                        Não foi possível carregar os presentes.
                    </div>
                `;

                return;
            }


            if (!data || data.length === 0) {

                lista.innerHTML = `
                    <div class="carregando">
                        Nenhum presente cadastrado.
                    </div>
                `;

                return;
            }


            lista.innerHTML = "";


            data.forEach(presente => {

                const card = document.createElement("div");

                card.className = "presente";


                const imagem = presente.imagem_url
                    ? presente.imagem_url
                    : "https://via.placeholder.com/600x400?text=Presente";


                if (presente.quantidade <= 0) {

                    card.innerHTML = `

                        <img
                            src="${imagem}"
                            alt="${presente.nome}"
                        >

                        <div class="conteudo">

                            <h2>
                                ${presente.nome}
                            </h2>

                            <div class="descricao">
                                ${presente.descricao || ""}
                            </div>

                            <div class="quantidade">
                                Esgotado
                            </div>

                            <button
                                class="esgotado"
                                disabled
                            >
                                Esgotado
                            </button>

                        </div>
                    `;

                } else {

                    card.innerHTML = `

                        <img
                            src="${imagem}"
                            alt="${presente.nome}"
                        >

                        <div class="conteudo">

                            <h2>
                                ${presente.nome}
                            </h2>

                            <div class="descricao">
                                ${presente.descricao || ""}
                            </div>

                            <div class="quantidade">
                                Disponíveis: ${presente.quantidade}
                            </div>

                            <button
                                onclick='abrirModal(${JSON.stringify(presente)})'
                            >
                                Escolher este presente
                            </button>

                        </div>
                    `;
                }


                lista.appendChild(card);

            });

        }


        // =====================================================
        // ABRIR MODAL
        // =====================================================

        function abrirModal(presente) {

            presenteSelecionado = presente;

            quantidadeEscolhida = 1;


            document.getElementById("nomePresente").innerText =
                presente.nome;


            document.getElementById("quantidadeEscolhida").innerText =
                quantidadeEscolhida;


            document.getElementById("nome").value = "";


            document.getElementById("modal").style.display =
                "flex";


            document.getElementById("nome").focus();

        }


        // =====================================================
        // FECHAR MODAL
        // =====================================================

        function fecharModal() {

            document.getElementById("modal").style.display =
                "none";

        }


        // =====================================================
        // AUMENTAR QUANTIDADE
        // =====================================================

        function aumentarQuantidade() {

            if (!presenteSelecionado) {
                return;
            }


            if (
                quantidadeEscolhida <
                presenteSelecionado.quantidade
            ) {

                quantidadeEscolhida++;


                document.getElementById(
                    "quantidadeEscolhida"
                ).innerText = quantidadeEscolhida;

            }

        }


        // =====================================================
        // DIMINUIR QUANTIDADE
        // =====================================================

        function diminuirQuantidade() {

            if (quantidadeEscolhida > 1) {

                quantidadeEscolhida--;


                document.getElementById(
                    "quantidadeEscolhida"
                ).innerText = quantidadeEscolhida;

            }

        }


        // =====================================================
        // CONFIRMAR PRESENTE
        // =====================================================

        async function confirmarPresente() {

            const nome =
                document.getElementById("nome")
                .value
                .trim();


            if (nome === "") {

                alert("Digite seu nome.");

                return;

            }


            if (!presenteSelecionado) {

                return;

            }


            const botao =
                document.querySelector(".confirmar");


            botao.disabled = true;

            botao.innerText = "Reservando...";


            // Chama a função criada no Supabase

            const { data, error } =
                await supabaseClient.rpc(
                    "reservar_presente",
                    {
                        p_presente_id:
                            presenteSelecionado.id,

                        p_nome:
                            nome,

                        p_quantidade:
                            quantidadeEscolhida
                    }
                );


            botao.disabled = false;

            botao.innerText =
                "Confirmar presente";


            // Erro de comunicação

            if (error) {

                console.error(
                    "Erro ao reservar:",
                    error
                );

                alert(
                    "Ocorreu um erro ao reservar o presente."
                );

                return;

            }


            // Resposta da função

            if (!data.sucesso) {

                alert(data.mensagem);

                fecharModal();

                carregarPresentes();

                return;

            }


            // Sucesso

            fecharModal();


            mostrarMensagem(
                "🎉 Presente reservado com sucesso! Obrigado, " +
                nome +
                "!"
            );


            // Atualiza a lista

            carregarPresentes();

        }


        // =====================================================
        // MENSAGEM
        // =====================================================

        function mostrarMensagem(texto) {

            const mensagem =
                document.getElementById("mensagem");


            mensagem.innerText = texto;

            mensagem.className =
                "mensagem sucesso";

            mensagem.style.display =
                "block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


            setTimeout(() => {

                mensagem.style.display =
                    "none";

            }, 5000);

        }


        // =====================================================
        // INICIAR
        // =====================================================

        carregarPresentes();

    </script>

</body>

</html>
