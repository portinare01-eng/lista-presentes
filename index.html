<script>

const SUPABASE_URL = "https://hoeefymvmncbgzrxdcwj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Fdv87uRPzxCOBmv-MFHt0w_dBdgMMrq";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// Guarda os presentes carregados do banco
let presentes = [];

let presenteSelecionado = null;

let quantidadeEscolhida = 1;


// ========================================
// CARREGAR PRESENTES DO SUPABASE
// ========================================
    
async function carregarPresentes() {

    const lista = document.querySelector(".lista");

    lista.innerHTML = "<p>Consultando Supabase...</p>";

    const { data, error } = await supabase
        .from("presentes")
        .select("*")
        .order("id", { ascending: true });


    if (error) {

        lista.innerHTML =
            "<p style='color:red;'>ERRO: " +
            error.message +
            "</p>";

        console.error("ERRO SUPABASE:", error);

        return;
    }


    console.log("DADOS RECEBIDOS:", data);


    // IMPORTANTE:
    // Guarda os presentes recebidos do Supabase
    presentes = data || [];


    // Mostra os presentes na tela
    mostrarPresentes();

}


// ========================================
// MOSTRAR PRESENTES NA TELA
// ========================================

function mostrarPresentes() {

    const lista = document.querySelector(".lista");

    lista.innerHTML = "";


    presentes.forEach((presente, indice) => {

        const card = document.createElement("div");

        card.className = "presente";


        const imagem = presente.foto_url
            ? presente.foto_url
            : "https://via.placeholder.com/800x500?text=Presente";


        let botao;


        if (presente.quantidade <= 0) {

            botao = `
                <button class="esgotado" disabled>
                    Esgotado
                </button>
            `;

        } else {

            botao = `
                <button onclick="abrirModal(${indice})">
                    Escolher presente
                </button>
            `;

        }


        card.innerHTML = `

            <img
                src="${imagem}"
                alt="${presente.nome}"
            >

            <div class="conteudo">

                <h2>${presente.nome}</h2>

                <div class="descricao">
                    ${presente.descricao || ""}
                </div>

                <div class="quantidade">
                    Disponível:
                    <span id="qtd-${indice}">
                        ${presente.quantidade}
                    </span>
                </div>

                ${botao}

            </div>
        `;


        lista.appendChild(card);

    });

}


// ========================================
// ABRIR MODAL
// ========================================

function abrirModal(indice) {

    if (presentes[indice].quantidade <= 0) {
        return;
    }


    presenteSelecionado = indice;

    quantidadeEscolhida = 1;


    document.getElementById("nomePresente").innerText =
        presentes[indice].nome;


    document.getElementById("quantidadeEscolhida").innerText =
        quantidadeEscolhida;


    document.getElementById("nome").value = "";


    document.getElementById("modal").style.display = "flex";

}


// ========================================
// FECHAR MODAL
// ========================================

function fecharModal() {

    document.getElementById("modal").style.display = "none";

}


// ========================================
// AUMENTAR QUANTIDADE
// ========================================

function aumentar() {

    if (presenteSelecionado === null) {
        return;
    }


    const disponivel =
        presentes[presenteSelecionado].quantidade;


    if (quantidadeEscolhida < disponivel) {

        quantidadeEscolhida++;


        document.getElementById(
            "quantidadeEscolhida"
        ).innerText = quantidadeEscolhida;

    }

}


// ========================================
// DIMINUIR QUANTIDADE
// ========================================

function diminuir() {

    if (quantidadeEscolhida > 1) {

        quantidadeEscolhida--;


        document.getElementById(
            "quantidadeEscolhida"
        ).innerText = quantidadeEscolhida;

    }

}


// ========================================
// CONFIRMAR PRESENTE
// ========================================

async function confirmarPresente() {

    const nome =
        document.getElementById("nome").value.trim();


    if (nome === "") {

        alert("Digite seu nome.");

        return;

    }


    if (presenteSelecionado === null) {
        return;
    }


    const presente =
        presentes[presenteSelecionado];


    // Desabilita o botão enquanto salva
    const botoes =
        document.querySelectorAll(".confirmar");

    botoes.forEach(botao => {
        botao.disabled = true;
        botao.innerText = "Salvando...";
    });


    // Chama a função segura do Supabase
    const { data, error } = await supabase.rpc(
        "escolher_presente",
        {
            p_presente_id: presente.id,
            p_nome: nome,
            p_quantidade: quantidadeEscolhida
        }
    );


    if (error) {

        console.error(error);

        alert(
            "Não foi possível registrar a escolha. Tente novamente."
        );

        botoes.forEach(botao => {
            botao.disabled = false;
            botao.innerText = "Confirmar presente";
        });

        return;
    }


    // Verifica resposta do banco
    if (!data.sucesso) {

        alert(data.mensagem);

        botoes.forEach(botao => {
            botao.disabled = false;
            botao.innerText = "Confirmar presente";
        });

        // Atualiza a lista caso a quantidade tenha mudado
        await carregarPresentes();

        fecharModal();

        return;
    }


    // Mostra mensagem de sucesso
    const mensagem =
        document.getElementById("mensagem");


    mensagem.innerText =
        "Obrigado, " + nome +
        "! Você escolheu " +
        quantidadeEscolhida +
        " unidade(s) de " +
        presente.nome +
        ".";


    mensagem.style.display = "block";


    fecharModal();


    // Recarrega a lista diretamente do banco
    await carregarPresentes();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ========================================
// INICIAR SITE
// ========================================

//carregarPresentes();
// ========================================
// INICIAR SITE
// ========================================

console.log("JAVASCRIPT FOI EXECUTADO!");

alert("O JavaScript está funcionando!");
    
</script>
